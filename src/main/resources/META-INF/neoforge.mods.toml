modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "assets/advancedmachinery/icon.png"
authors = "${mod_authors}"
description = "${mod_description}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/actually-additions-advanced-machinery"
issueTrackerURL = "https://github.com/Franchino961-Mod/Actually-Additions-Advanced-Machinery/issues"

# FIX: era "[${neo_version},)" che espandeva a "[21.1.223,)" richiedendo
# esattamente quella build o superiore. Ora usa ${neo_version_range}
# definita in gradle.properties come "[21.1.0,)" — accetta qualsiasi
# build della patch family 21.1.x, che è il comportamento corretto
# per un addon pubblico.
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "actuallyadditions"
type = "required"
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19,)"
ordering = "NONE"
side = "BOTH"